<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Смета за 5 минут</h1>
      <p>Укажите реквизиты и добавьте позиции — итог посчитается автоматически.</p>
    </header>
    <h1 id="print-title" class="print-only"></h1>
    <section class="card" aria-labelledby="details-title">
      <h2 id="details-title">Реквизиты</h2>
      <div class="details">
        <label>От кого<input type="text" name="sender" placeholder="Ваше имя или компания"></label>
        <label>Для кого<input type="text" name="recipient" placeholder="Имя клиента или компания"></label>
        <label>Номер сметы<input type="text" name="estimate-number" placeholder="Например, 001"></label>
        <label>Дата<input type="date" id="estimate-date" name="date"></label>
      </div>
    </section>
    <section class="card" aria-labelledby="items-title">
      <h2 id="items-title">Позиции</h2>
      <table>
        <thead><tr><th scope="col">Наименование</th><th scope="col">Количество</th><th scope="col">Единица</th><th scope="col">Цена</th><th scope="col">Сумма</th><th scope="col"><span class="sr-only">Удаление</span></th></tr></thead>
        <tbody id="items"></tbody>
      </table>
      <button type="button" id="add-item">+ Добавить позицию</button>
      <div class="adjustments">
        <label>Скидка, %<input id="discount-rate" type="text" inputmode="decimal" value="0"></label>
        <label>НДС, %<input id="vat-rate" type="text" inputmode="decimal" value="0"></label>
        <label>Валюта<select id="currency"><option value="₸">₸</option><option value="₽">₽</option><option value="$">$</option><option value="€">€</option></select></label>
      </div>
    </section>
    <section class="total-card" aria-label="Итог сметы">
      <dl class="summary">
        <div class="summary-row"><dt>Сумма</dt><dd><output id="subtotal">0 ₸</output></dd></div>
        <div class="summary-row" id="discount-row" hidden><dt>Скидка</dt><dd><output id="discount-amount">0 ₸</output></dd></div>
        <div class="summary-row" id="discounted-row" hidden><dt>Сумма со скидкой</dt><dd><output id="discounted-amount">0 ₸</output></dd></div>
        <div class="summary-row" id="vat-row" hidden><dt>НДС</dt><dd><output id="vat-amount">0 ₸</output></dd></div>
        <div class="summary-row grand-total"><dt>Итого к оплате</dt><dd><output id="total" aria-live="polite" aria-atomic="true">0 ₸</output></dd></div>
      </dl>
    </section>
    <section class="card comment-card" aria-labelledby="comment-title">
      <h2 id="comment-title">Комментарий</h2>
      <label for="comment">Сроки и условия оплаты</label>
      <textarea id="comment" rows="4" placeholder="Например, оплата в течение 5 рабочих дней"></textarea>
    </section>
    <p class="print-only signature">Подпись: ____________________</p>
    <button type="button" id="save-pdf">Сохранить PDF</button>
  </main>
  <template id="item-template">
    <tr>
      <td data-label="Наименование"><input class="item-name" type="text" aria-label="Наименование" placeholder="Товар или услуга"></td>
      <td data-label="Количество"><input class="quantity" type="text" inputmode="decimal" aria-label="Количество" placeholder="0"></td>
      <td data-label="Единица"><select aria-label="Единица"><option>шт</option><option>час</option><option>услуга</option></select></td>
      <td data-label="Цена"><input class="price" type="text" inputmode="decimal" aria-label="Цена, ₸" placeholder="0"></td>
      <td data-label="Сумма" class="amount-cell"><output class="amount">0 ₸</output></td>
      <td class="remove-cell"><button class="remove" type="button" aria-label="Удалить позицию">✕</button></td>
    </tr>
  </template>
</body>
</html>
